<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrayVerse Studios | Links</title>

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ============================================
       🎨 THEME / COLORS — Edit these to restyle!
       ============================================ */
    :root {
      --bg-color: #0b0b1a;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover-bg: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-secondary: #a0a0b8;
      --accent: #7c5cfc;
      --accent-glow: rgba(124, 92, 252, 0.35);
      --link-radius: 14px;
    }

    /* ============================================
       🔄 BACKGROUND — Repeating tiled pattern
       Swap the background-image URL for your own!
       ============================================ */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text-primary);
      background-color: var(--bg-color);

      /* --- TILED BACKGROUND PATTERN --- */
      /* This is a subtle dot-grid that repeats seamlessly.
         To use your own image, replace the url(...) with:
         background-image: url("your-background.png");       */
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='1.2' fill='%23ffffff' fill-opacity='0.07'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 40px 40px;

      /* Optional: a soft radial glow behind the content */
      background-blend-mode: normal;
    }

    /* Ambient glow layer */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 60% 50% at 50% 30%,
        var(--accent-glow),
        transparent
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================
       LAYOUT
       ============================================ */
    .container {
      position: relative;
      z-index: 1;
      max-width: 460px;
      margin: 0 auto;
      padding: 60px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ============================================
       LOGO & NAME
       ============================================ */
    .logo-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--card-border);
      box-shadow: 0 0 30px var(--accent-glow);
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin: 0 0 40px;
      text-align: center;
    }

    /* ============================================
       LINKS
       ============================================ */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--link-radius);
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .link:hover {
      transform: translateY(-2px) scale(1.02);
      background: var(--card-hover-bg);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3), 0 0 12px var(--accent-glow);
    }

    .link:active {
      transform: scale(0.98);
    }

    .link-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
      color: #fff;
    }

    /* Individual icon brand colors */
    .icon-x             { background: #000000; }
    .icon-youtube       { background: #ff0000; }
    .icon-twitch        { background: #9146ff; }
    .icon-discord       { background: #5865f2; }
    .icon-github        { background: #333333; }
    .icon-website       { background: var(--accent); }
    .icon-email         { background: #ea4335; }
    .icon-itch          { background: #db7169; }
    .icon-royal-road    { background: #fff6c1; }
    .icon-ao3           { background: #9f4242; }
    .icon-looms         { background: #e23b3b; }
    .icon-forms         { background: #5f1d8b; }

    .link-label {
      flex: 1;
    }

    .link-arrow {
      color: var(--text-secondary);
      font-size: 0.85rem;
      transition: transform 0.2s ease;
    }

    .link:hover .link-arrow {
      transform: translateX(3px);
    }

    /* ============================================
       FOOTER
       ============================================ */
    .footer {
      margin-top: 50px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.5;
    }

    /* ============================================
       FADE-IN ANIMATION
       ============================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container > * {
      animation: fadeUp 0.5s ease both;
    }
    .container > *:nth-child(1) { animation-delay: 0.05s; }
    .container > *:nth-child(2) { animation-delay: 0.1s; }
    .container > *:nth-child(3) { animation-delay: 0.15s; }
    .container > *:nth-child(4) { animation-delay: 0.2s; }
    .container > *:nth-child(5) { animation-delay: 0.25s; }
  </style>
</head>

<body>
